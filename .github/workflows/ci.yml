name: Protocol CI

on:
  pull_request:
  push:
    branches: [main, stage]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests and fixture drift
        run: cargo test --all --locked
      - name: Public API compatibility guard
        run: cargo test --locked --test public_surface
      - name: Offline package verification
        run: cargo package --allow-dirty --offline
      - name: Diff hygiene
        run: git diff --check
